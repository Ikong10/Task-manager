<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>

  <body
    class="bg-gray-200 dark:bg-gray-900 text-black dark:text-white transition text-xl sm:text-2xl"
  >
    <div
      id="toast"
      class="fixed top-5 right-5 bg-black text-white px-4 py-2 rounded shadow hidden z-50 text-sm"
    ></div>

    <div class="flex min-h-screen">
      <aside
        class="bg-blue-900 w-20 sm:w-64 p-3 sm:p-6 text-white flex flex-col items-center sm:items-start rounded-tr-[40px]"
      >
        <h1 class="text-lg sm:text-xl mb-6 font-bold">
          D<span class="text-[#CCAC00]">a</span>ily T<span
            class="text-[#CCAC00]"
            >a</span
          >sks
        </h1>

        <ul class="space-y-3 text-xs sm:text-sm w-full">
          <li
            onclick="setView('pending')"
            id="pendingTab"
            class="px-2 sm:px-4 py-2 rounded-md bg-blue-700 cursor-pointer text-center sm:text-left"
          >
            Tasks
          </li>

          <li
            onclick="setView('completed')"
            id="completedTab"
            class="px-2 sm:px-4 py-2 rounded-md hover:bg-blue-700 cursor-pointer text-center sm:text-left"
          >
            Done
          </li>
        </ul>
      </aside>

      <main class="flex-1 p-3 sm:p-6">
        <header
          class="flex flex-col sm:flex-row items-center justify-between gap-2 mb-6"
        >
          <h2
            id="sectionTitle"
            class="text-2xl sm:text-4xl font-bold text-center sm:text-left w-full sm:w-auto"
          >
            Current Tasks
          </h2>

          <div class="flex items-center gap-2">
            <button
              onclick="toggleDark()"
              class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-300 dark:hover:bg-gray-700"
              aria-label="Toggle dark mode"
            >
              🌙
            </button>

            <input
              id="search"
              placeholder="Search..."
              class="w-[140px] sm:w-[220px] px-4 py-3 rounded border text-base sm:text-lg dark:bg-gray-800 dark:text-white"
              aria-label="Search tasks"
            />
          </div>
        </header>

        <section
          class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded shadow mb-8 text-base sm:text-lg"
        >
          <div id="taskList"></div>
          <p id="emptyMsg" class="text-xs text-gray-500 hidden">
            No tasks found
          </p>
        </section>

        <section
          class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded shadow text-base sm:text-lg max-w-xl mx-auto"
        >
          <form id="taskForm" class="flex flex-col gap-3 sm:gap-4">
            <input
              id="taskInput"
              placeholder="Task name"
              class="border px-3 py-3 rounded dark:bg-gray-700 dark:text-white text-base sm:text-lg"
            />

            <textarea
              id="taskDetails"
              placeholder="Details"
              class="border px-3 py-3 rounded dark:bg-gray-700 dark:text-white text-base sm:text-lg"
            ></textarea>

            <input
              type="datetime-local"
              id="dueDate"
              class="border px-3 py-3 rounded dark:bg-gray-700 dark:text-white text-base sm:text-lg"
            />

            <select
              id="priority"
              class="border px-3 py-3 rounded dark:bg-gray-700 dark:text-white text-base sm:text-lg"
            >
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>

            <button
              type="submit"
              class="bg-blue-500 text-white py-3 rounded-[8px] w-[90px] mx-auto text-lg font-semibold hover:bg-blue-600 transition"
            >
              Add Task
            </button>
          </form>
        </section>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
